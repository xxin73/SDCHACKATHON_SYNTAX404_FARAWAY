kind = "web"
previewPath = "/"
title = "Faraway"
description = "Existing Faraway skills and learning dashboard, restored from the supplied project with two targeted visual refinements."
version = "1.0.0"
id = "artifacts/faraway"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20831

[services.development]
run = "pnpm --filter @workspace/faraway run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/faraway", "run", "build" ]
serve = "static"
publicDir = "artifacts/faraway/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20831"
BASE_PATH = "/"
