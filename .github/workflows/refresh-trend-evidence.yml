name: Refresh public trend evidence
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-trend-evidence
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate public sources
        working-directory: Faraway
        run: node scripts/update-trend-evidence.cjs
      - name: Publish dated shared snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Faraway/artifacts/faraway/public/trend-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dated public trend evidence"
            git push
          fi
